name: Decision / RFC
description: Propose and preserve a consequential decision, its evidence, and its implementation handoff.
title: "[DECISION] "
body:
  - type: markdown
    attributes:
      value: |
        Use this for choices with lasting architectural, product, workflow, or public-truth consequences. Keep exploration here; link the accepted canonical decision record when resolved.

  - type: input
    id: work_id
    attributes:
      label: Decision / work ID
      placeholder: ADR-0012 / CORE-042
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Decision owner
      description: The accountable domain owner; not merely the note taker.
      placeholder: Name or agent role
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Proposed
        - Accepted
        - Rejected
        - Superseded
    validations:
      required: true

  - type: textarea
    id: question_context
    attributes:
      label: Decision question and context
      description: State the single choice, why it is needed now, and the constraints that matter.
      placeholder: |
        We need to decide...
        This is triggered now because...
        Constraints/invariants: ...
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Viable options and trade-offs
      description: Include the status quo. Compare consequences rather than writing a feature wish list.
      placeholder: |
        1. Option — benefits; costs; failure modes
        2. Option — benefits; costs; failure modes
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation or accepted decision
      description: State the preferred/accepted choice, rationale, consequences, and what would cause reconsideration.
      placeholder: |
        Choice: ...
        Because: ...
        Consequences: ...
        Revisit when: ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and validation
      description: Link experiments, research, implementation evidence, or explicit assumptions. Record contrary evidence too.
      placeholder: |
        Evidence:
        - ...
        Assumptions / unknowns:
        - ...
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and impact
      description: Link prior decisions/work, name what this blocks or unblocks, and call out migration or compatibility impact.
      placeholder: |
        Depends on: ...
        Blocks/unblocks: ...
        Compatibility/migration: ...
    validations:
      required: true

  - type: textarea
    id: departments
    attributes:
      label: Affected departments and lanes
      description: Mark each as Consulted, Informed, or Action required, with acknowledgement/follow-up.
      placeholder: |
        - Systems Architecture — Consulted — @name agreed / pending
        - Bevy Client — Action required — migrate after acceptance
    validations:
      required: true

  # ART-CONTRACT: IMPACT-DECLARATION
  - type: textarea
    id: art_technical_art_impact
    attributes:
      label: Art / Technical Art impact
      description: Required. Begin with exactly `Action required`, `Consulted`, `Informed`, or `N/A — <nonempty rationale>`. State effects on visual contracts, asset schemas, render/capture behavior, tools, performance budgets, or art workflows. Bare `N/A` is invalid.
      placeholder: |
        Action required — Technical Art must accept the asset schema and rendering-budget consequences before this decision can be accepted.
        N/A — Workflow-only decision with no visual, asset, render, capture, tool, performance, or art-production consequence.
    validations:
      required: true

  - type: textarea
    id: implementation_handoff
    attributes:
      label: Implementation handoff
      description: Connect the decision to executable work. For discussion-only RFCs, use base=head and write set `None`.
      placeholder: |
        Base SHA: ...
        Head SHA: ...
        Declared write set: ...
        Implementation work/PR: ...
        Canonical decision record: ...
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and recovery
      placeholder: |
        Risks / unresolved consequences: ...
        Recovery, rollback, or supersession path: ...
    validations:
      required: true

  - type: textarea
    id: reviewer_gates
    attributes:
      label: Reviewer gates
      description: Name domain and impacted-boundary reviewers. Mark irrelevant gates `N/A - reason`.
      placeholder: |
        - Decision owner — @name — pending
        - Affected domain owner(s) — @name — pending
        - Architecture/long-term review — @name — pending
        - Public truth/marketing — N/A — no public claim impact
        - Integration/recording — @name — pending
    validations:
      required: true

  # ART-CONTRACT: REVIEW-GATE
  - type: textarea
    id: art_technical_art_reviewer_gate
    attributes:
      label: Art / Technical Art reviewer gate
      description: Name the Art/Technical Art reviewer, routing status, and decision evidence when acceptance affects Art. Otherwise use `N/A — <nonempty rationale>` consistent with the impact declaration.
      placeholder: Technical Art — @reviewer — pending acceptance of asset/render/capture consequences
    validations:
      required: true

  - type: input
    id: next_action
    attributes:
      label: Next owner and action
      placeholder: Decision owner — resolve consultation, record acceptance, and dispatch implementation packet.
    validations:
      required: true

  - type: checkboxes
    id: integrity
    attributes:
      label: Record integrity
      options:
        - label: The affected groups and required reviewers are explicit.
          required: true
        - label: The working tree is clean, or pre-existing changes are disclosed under risks.
          required: true
        - label: Acceptance will update a canonical decision record and create/link any implementation work.
          required: true
        - label: The Art / Technical Art impact uses an allowed prefix, any `N/A` has a specific rationale, and its reviewer/routing gate is named.
          required: true

  - type: checkboxes
    id: closeout
    attributes:
      label: Closeout
      description: Complete these when the decision is resolved, not while it is merely proposed.
      options:
        - label: Consulted groups and reviewer gates have responded.
        - label: Status, rationale, consequences, and canonical record are final.
        - label: Action-required departments have named work packets and owners.
        - label: Required Art / Technical Art review and routing are complete.
        - label: Base/head SHAs, write set, validation, and residual risk are current.
        - label: The final working tree is clean and the next owner has accepted the handoff.
