name: Review finding
description: Record an actionable defect, long-term blocker, or unresolved risk found during review.
title: "[REVIEW] "
body:
  - type: markdown
    attributes:
      value: |
        File one finding per independently actionable problem. Explain the failure mode and acceptance evidence; do not use this form for optional style preferences.

  - type: input
    id: work_id
    attributes:
      label: Review / work ID
      placeholder: RV-0017 / CORE-042
    validations:
      required: true

  - type: input
    id: reviewer
    attributes:
      label: Finding owner / reviewer
      description: Owns clarity and verifies resolution; may differ from the fixing owner.
      placeholder: Name or agent role
    validations:
      required: true

  - type: input
    id: fixing_owner
    attributes:
      label: Resolution owner
      description: The department, agent, or person accountable for disposition.
      placeholder: Name, agent, or owning lane
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Choose based on consequence, not effort.
      options:
        - P0 — unsafe, destructive, or release-stopping
        - P1 — incorrect behavior or major architectural blocker
        - P2 — material maintainability, performance, or edge-case risk
        - P3 — bounded improvement with low immediate risk
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: Review target and baseline
      description: Pin the exact version reviewed so later changes cannot blur the finding.
      placeholder: |
        PR / artifact / path: ...
        Base SHA: ...
        Head SHA reviewed: ...
        Branch/worktree: ...
    validations:
      required: true

  - type: textarea
    id: write_set
    attributes:
      label: Declared reviewer write set
      description: Usually `None - read-only review`. If the reviewer will patch evidence or docs, name the exact paths.
      placeholder: None - read-only review
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: Finding and evidence
      description: Identify the tightest useful location, current behavior, expected invariant, and reproducible evidence.
      placeholder: |
        Location: path:line or section
        Current behavior: ...
        Expected invariant: ...
        Evidence/reproduction: ...
    validations:
      required: true

  - type: textarea
    id: consequence
    attributes:
      label: Consequence and trigger
      description: Explain who/what fails, under which conditions, and why the selected severity is justified.
      placeholder: When ..., this causes ..., affecting ...
    validations:
      required: true

  - type: textarea
    id: resolution
    attributes:
      label: Required resolution and verification
      description: Define acceptance without over-prescribing implementation unless the implementation itself is constrained.
      placeholder: |
        Accepted when: ...
        Verify with: ...
        Non-goals: ...
    validations:
      required: true

  - type: textarea
    id: dependencies_decisions
    attributes:
      label: Dependencies and decisions
      description: Link governing decisions, blocked work, and any decision needed. Use `None` when isolated.
      placeholder: |
        Governing decisions: ...
        Depends on / blocks: ...
        Decision needed: ...
    validations:
      required: true

  - type: textarea
    id: departments
    attributes:
      label: Affected departments and lanes
      description: Mark each Consulted, Informed, or Action required and name acknowledgement/follow-up.
      placeholder: |
        - World Core — Action required — @owner assigned
        - Systems Architecture — Consulted — boundary impact under review
    validations:
      required: true

  # ART-CONTRACT: IMPACT-DECLARATION
  - type: textarea
    id: art_technical_art_impact
    attributes:
      label: Art / Technical Art impact
      description: Required. Begin with exactly `Action required`, `Consulted`, `Informed`, or `N/A — <nonempty rationale>`. State whether the finding or its resolution affects visual contracts, assets, rendering/capture, tools, performance budgets, or art workflows. Bare `N/A` is invalid.
      placeholder: |
        Consulted — Technical Art must verify the proposed rendering-budget fix before this finding closes.
        N/A — Pure data-validation finding with no visual, asset, render, capture, tool, performance, or art-workflow effect.
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and temporary containment
      description: State the risk of deferral, available containment, and safe recovery/rollback. Use `None` if not applicable.
      placeholder: |
        Deferral risk: ...
        Temporary containment: ...
        Recovery/rollback: ...
    validations:
      required: true

  - type: textarea
    id: reviewer_gates
    attributes:
      label: Disposition and reviewer gates
      description: Name who must accept the fix, deferral, or rejection. Mark irrelevant gates `N/A - reason`.
      placeholder: |
        - Resolution owner — @name — pending
        - Finding reviewer — @name — pending verification
        - Domain/architecture owner — @name or N/A — ...
        - Integrator — @name — pending
    validations:
      required: true

  # ART-CONTRACT: REVIEW-GATE
  - type: textarea
    id: art_technical_art_reviewer_gate
    attributes:
      label: Art / Technical Art reviewer gate
      description: Name the Art/Technical Art reviewer, routing status, and closure evidence when the finding or fix affects Art. Otherwise use `N/A — <nonempty rationale>` consistent with the impact declaration.
      placeholder: Technical Art — @reviewer — pending verification of the asset/render/capture fix
    validations:
      required: true

  - type: input
    id: next_action
    attributes:
      label: Next owner and action
      placeholder: Resolution owner — patch the invariant, attach validation, then return to reviewer.
    validations:
      required: true

  - type: checkboxes
    id: review_checks
    attributes:
      label: Review integrity
      options:
        - label: I reviewed the pinned base/head SHAs and did not silently change implementation scope.
          required: true
        - label: My working tree is clean, or reviewer-authored changes are declared above.
          required: true
        - label: This finding describes a concrete failure mode and verifiable acceptance condition.
          required: true
        - label: The Art / Technical Art impact uses an allowed prefix, any `N/A` has a specific rationale, and its reviewer/routing gate is named.
          required: true

  - type: checkboxes
    id: closeout
    attributes:
      label: Resolution handoff
      description: Complete after the resolution owner responds.
      options:
        - label: The fix/decision is linked with its final head SHA and validation evidence.
        - label: The finding reviewer verified resolution or documented why it was accepted/rejected/deferred.
        - label: Required reviewer gates and action-required notifications are complete.
        - label: Required Art / Technical Art review and routing are complete.
        - label: Residual risks, canonical records, and the next action are current.
        - label: The final working tree is clean and integration is confirmed.
