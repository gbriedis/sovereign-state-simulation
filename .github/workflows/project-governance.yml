name: Project Governance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-governance:
    name: project-governance
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate project governance
        shell: pwsh
        run: ./tools/project-governance.ps1 -Mode Validate -StrictMetadata
