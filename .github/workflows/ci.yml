name: Rust

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PROJECT-CI: RUST-IMPACT-GATE
  changes:
    name: rust-impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Rust-impacting changes
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          else
            mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          fi

          required=false
          for changed_path in "${changed_files[@]}"; do
            case "$changed_path" in
              Cargo.toml|Cargo.lock|rust-toolchain.toml|rustfmt.toml|clippy.toml|.cargo/*|crates/*|*.rs|.github/actions/*)
                required=true
                break
                ;;
            esac
          done

          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"
          printf 'Rust-impacting change: %s\n' "$required" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --locked

  core-portability:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint renderer-independent world core
        run: cargo clippy -p sovereign-world --all-targets --locked -- -D warnings

      - name: Test renderer-independent world core
        run: cargo test -p sovereign-world --all-targets --locked

      - name: Test world-core documentation
        run: cargo test -p sovereign-world --doc --locked

  # PROJECT-CI: RUST-GATE
  rust-gate:
    name: rust-gate
    if: always()
    needs:
      - changes
      - checks
      - tests
      - core-portability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve required Rust checks
        shell: pwsh
        env:
          RUST_REQUIRED: ${{ needs.changes.outputs.required }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CORE_RESULT: ${{ needs.core-portability.result }}
        run: |
          if ($env:CHANGES_RESULT -ne 'success') {
              throw "Rust impact detection failed: $env:CHANGES_RESULT"
          }

          if ($env:RUST_REQUIRED -ne 'true') {
              Write-Output 'No Rust-impacting paths changed; hosted Rust compilation is not required.'
              exit 0
          }

          $requiredResults = @(
              $env:CHECKS_RESULT,
              $env:TESTS_RESULT,
              $env:CORE_RESULT
          )
          $failedResults = @($requiredResults | Where-Object { $_ -ne 'success' })
          if ($failedResults.Count -gt 0) {
              throw "Required Rust checks did not all pass: $($requiredResults -join ', ')"
          }

          Write-Output 'All required Rust checks passed.'
