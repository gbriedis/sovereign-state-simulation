name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --locked

  core-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint renderer-independent world core
        run: cargo clippy -p sovereign-world --all-targets --locked -- -D warnings

      - name: Test renderer-independent world core
        run: cargo test -p sovereign-world --all-targets --locked

      - name: Test world-core documentation
        run: cargo test -p sovereign-world --doc --locked
