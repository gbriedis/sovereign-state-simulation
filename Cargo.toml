[workspace]
members = [
    "crates/client",
    "crates/world_core",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d"] }

# Give first-party code fast checks while keeping rendering dependencies usable
# in development builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
